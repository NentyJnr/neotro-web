<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Dark Squircle Background -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1E2E"/>
      <stop offset="100%" stop-color="#09141F"/>
    </linearGradient>

    <!-- Africa Continent Silhouette Gradient -->
    <linearGradient id="africaSil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0E2238"/>
    </linearGradient>

    <!-- Beveled Ribbon 3D White/Silver Highlight -->
    <linearGradient id="ribbonSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Inner Ribbon Blue/Navy Channel -->
    <linearGradient id="ribbonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="100" height="100" rx="22" fill="url(#favBg)"/>

  <g filter="url(#shadowFilter)">
    <!-- Stylized Africa Silhouette Contour -->
    <path d="M30 18 C38 12, 56 12, 62 18 C65 24, 76 34, 76 40 C70 44, 66 52, 64 60 C60 72, 54 82, 50 86 C46 84, 44 76, 44 70 C42 64, 38 60, 36 54 C30 54, 22 42, 22 34 C22 26, 26 20, 30 18 Z" fill="url(#africaSil)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- Madagascar Island -->
    <path d="M72 64 C74 60, 76 66, 75 72 C73 76, 71 74, 72 64 Z" fill="url(#africaSil)" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.3"/>

    <!-- 3D Interlocking 'N' Ribbon Layer 1: Left / Top Arm -->
    <path d="M28 36 L38 22 L56 38 L48 50 L38 42 L34 46 Z" fill="url(#ribbonSilver)"/>
    <path d="M38 22 L56 38 L54 42 L38 26 Z" fill="#FFFFFF"/>
    <path d="M30 38 L38 26 L38 32 L34 44 Z" fill="url(#ribbonBlue)"/>

    <!-- 3D Interlocking 'N' Ribbon Layer 2: Center Diagonal & Right Arm -->
    <path d="M48 50 L64 32 L72 44 L58 64 L50 58 Z" fill="url(#ribbonSilver)"/>
    <path d="M64 32 L72 44 L70 48 L62 36 Z" fill="#FFFFFF"/>
    <path d="M50 58 L58 64 L56 70 L48 64 Z" fill="url(#ribbonBlue)"/>

    <!-- 3D Interlocking 'N' Ribbon Layer 3: Bottom Arm -->
    <path d="M46 68 L54 60 L62 74 L54 82 L48 74 Z" fill="url(#ribbonSilver)"/>
  </g>
</svg>